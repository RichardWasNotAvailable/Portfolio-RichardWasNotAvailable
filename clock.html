<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
      <link rel="icon" type="image/x-icon" href="/IMG/DuckMonogram.ico">
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fira Code', sans-serif;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .clock-widget {
            background: transparent;
            border-radius: 16px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
            padding: 32px 48px;
            text-align: center;
        }
        .clock-time {
            color: #7a65db;
            font-size: 2.5rem;
            font-weight: 700;
            margin: 12px 0 4px 0;
            letter-spacing: 1px;
        }
        .clock-label {
            color: #888;
            font-size: 1rem;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="clock-widget">
        <div id="utc-time" class="clock-time">--:--:-- UTC</div>
    </div>
    <script>
        function pad(n) { return n < 10 ? '0' + n : n; }
        function updateClocks() {
            const now = new Date();
            // UTC Time
            const utcHours = pad(now.getUTCHours());
            const utcMinutes = pad(now.getUTCMinutes());
            const utcSeconds = pad(now.getUTCSeconds());
            document.getElementById('utc-time').textContent = `${utcHours}:${utcMinutes}:${utcSeconds} UTC`;
            // Amsterdam Time (UTC+1 or UTC+2 with DST)
            // Use Intl API for correct DST handling
        }
        updateClocks();
        setInterval(updateClocks, 1000);
    </script>
</body>
</html>
