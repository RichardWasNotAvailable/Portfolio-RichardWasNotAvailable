<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Cookies</title>
  <link rel="icon" type="image/x-icon" href="/IMG/DuckMonogram.ico">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen text-white font-sans bg-gradient-to-br from-black via-gray-900 to-gray-800">

  <h2 class="text-2xl md:text-3xl font-bold mb-8 mt-24 text-pink-300 text-center">
    Cookies are not free! >:(
  </h2>

  <button onclick="window.history.back()"
    class="flex items-center gap-2 px-4 py-2 mb-6 rounded-lg bg-gray-800 hover:bg-gray-700 text-white font-semibold shadow-lg transition-all focus:outline-none focus:ring-2 focus:ring-gray-500 border border-gray-700 mx-auto">
    <span class="inline-block">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
    </span>
    Go Back
  </button>

  <!-- Centered Video -->
  <video id="rickroll-video"
    src="./IMG/rick.mp4"
    autoplay loop controls playsinline
    class="rounded-lg mt-4 mb-8 w-full max-w-md aspect-video object-cover mx-auto"
    muted>
  </video>

  <script>
    const video = document.getElementById('rickroll-video');

    function tryPlay() {
      video.muted = false;
      video.play().catch(() => {});
    }

    tryPlay();

    document.addEventListener('click', tryPlay);
    document.addEventListener('keydown', tryPlay);
    document.addEventListener('mousemove', tryPlay);
    video.addEventListener('canplay', tryPlay);
  </script>

</body>
</html>
